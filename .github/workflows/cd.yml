name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cd:
    # So o CI de push neste repositorio (merge na main): o filtro "branches: [main]" olha so o
    # nome da branch, e um PR de fork com uma branch "main" tambem dispararia o CD.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    uses: fiap-postech-soat-lf/fiap-soat-mecanica-k8s/.github/workflows/servico-cd.yml@v1
    with:
      servico: os
    secrets: inherit

  # E2E da Saga depois do deploy (F7-c). Com o EKS desligado o "cd" termina verde e pulado, e o
  # proprio e2e.yml se pula pelo porteiro (SSM /mecanica/auth/api-url ausente).
  e2e:
    needs: cd
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
