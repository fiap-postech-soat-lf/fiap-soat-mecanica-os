management.otlp.metrics.export.enabled=false
app.messaging.consumidor.enabled=false

# A chave publica e os containers sao injetados pelo IntegracaoTest (DynamicPropertySource).
app.aws.access-key-id=test
app.aws.secret-access-key=test

spring.jpa.show-sql=false
app.saga.timeout.scheduler-habilitado=false

# Prazos da Saga nos testes (tabela 3.1 da F4): segundos, para o SagaOrquestradorIT esperar o vencimento
app.saga.timeout.comando=PT3S
app.saga.timeout.tentativas=3
app.saga.timeout.margem-aprovacao=PT2S
app.saga.timeout.intervalo=PT1S
