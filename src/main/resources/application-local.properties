# Perfil local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Infra local: docker compose -f ../fiap-soat-mecanica-k8s/local/docker-compose.yml up -d
server.port=8082
logging.level.br.com.fiap.soat.mecanica=DEBUG
management.otlp.metrics.export.enabled=false

# Chave publica de dev gerada por local/jwt/gerar-chaves-dev.sh no -k8s
app.security.jwt.public-key=file:../fiap-soat-mecanica-k8s/local/jwt/dev-public.pem

# LocalStack
app.aws.endpoint=http://localhost:4566
app.aws.access-key-id=test
app.aws.secret-access-key=test
# Filas do LocalStack (nomes da tabela 3.4), ex.:
# app.messaging.consumidor.filas=http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/mecanica-<svc>-comandos

spring.datasource.url=jdbc:postgresql://localhost:5434/os
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=true
